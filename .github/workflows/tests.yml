name: VOLTPAY Test Suite

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    laravel-tests:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: listrik_pascabayar_test
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath
                  coverage: none

            - name: Copy .env.example to .env
              run: cp .env.example .env

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Generate application key
              run: php artisan key:generate

            - name: Setup Node.js & Build Vite assets
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install NPM dependencies & build assets
              run: |
                  npm ci
                  npm run build

            - name: Run VOLTPAY Automated Tests
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: listrik_pascabayar_test
                  DB_USERNAME: root
                  DB_PASSWORD: ''
              run: php artisan test
